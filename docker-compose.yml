services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: petropolis-mediamtx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:9997:9997"
      - "8189:8189/udp"

    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
